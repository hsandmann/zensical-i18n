  Styles of the language selector and untranslated page notice, built on
  the theme's variables, so they follow its color schemes and variants.
-#}
<style>
  .md-i18n .md-i18n__button:not([hidden]) {
    display: inline-flex;
    gap: .3rem;
    align-items: center;
    padding-inline: .5rem .4rem;
    border-radius: 1rem;
    transition: background-color .25s, opacity .25s;
  }
  .md-i18n__button:hover,
  .md-i18n .md-select:focus-within .md-i18n__button {
    background-color: color-mix(in srgb, currentcolor 8%, transparent);
  }
  .md-i18n__code {
    font-size: .6rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .md-i18n .md-i18n__chevron svg {
    width: .7rem;
    height: .7rem;
    opacity: .7;
    transition: transform .25s cubic-bezier(.1, .7, .1, 1);
  }
  .md-i18n .md-select:hover .md-i18n__chevron svg,
  .md-i18n .md-select:focus-within .md-i18n__chevron svg {
    transform: rotate(180deg);
  }
  .md-i18n__inner {
    min-width: 11rem;
  }
  .md-i18n__list {
    padding: .3rem;
  }
  .md-i18n .md-i18n__link {
    display: flex;
    gap: .6rem;
    align-items: center;
    padding: .2rem .5rem;
    border-radius: .3rem;
    line-height: 1.6rem;
  }
  .md-i18n .md-i18n__link:is(:hover, :focus-visible) {
    color: var(--md-default-fg-color);
    background-color: var(--md-default-fg-color--lightest);
  }
  .md-i18n__name {
    flex-grow: 1;
    font-size: .7rem;
    white-space: nowrap;
  }
  .md-i18n__locale {
    font-size: .55rem;
    font-weight: 700;
    color: var(--md-default-fg-color--light);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .md-i18n .md-i18n__check svg {
    width: .8rem;
    height: .8rem;
    color: var(--md-accent-fg-color);
    visibility: hidden;
  }
  .md-i18n__link[aria-current] .md-i18n__name {
    font-weight: 700;
  }
  .md-i18n__link[aria-current] .md-i18n__check svg {
    visibility: visible;
  }
  .md-i18n__link[data-md-i18n-missing] .md-i18n__name {
    color: var(--md-default-fg-color--light);
  }
  .md-typeset .md-i18n-notice {
    display: flex;
    gap: .6rem;
    align-items: flex-start;
    padding: .6rem .8rem;
    margin: 0 0 1.5em;
    font-size: .7rem;
    color: var(--md-default-fg-color--light);
    background-color: color-mix(in srgb, var(--md-accent-fg-color) 6%, transparent);
    border: .05rem solid color-mix(in srgb, var(--md-accent-fg-color) 25%, transparent);
    border-radius: .4rem;
  }
  .md-typeset .md-i18n-notice p {
    margin: 0;
  }
  .md-i18n-notice .md-icon svg {
    width: 1rem;
    height: 1rem;
    margin-top: .1rem;
    color: var(--md-accent-fg-color);
  }
  @media print {
    .md-typeset .md-i18n-notice {
      display: none;
    }
  }
</style>

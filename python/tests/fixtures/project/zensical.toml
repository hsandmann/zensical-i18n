[project]
site_name = "Docs"
site_url = "https://example.com/docs/"
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Install" = "guide/install.md" },
  ] },
]

[project.theme]
features = ["navigation.instant"]

[project.plugins.i18n]

[[project.plugins.i18n.languages]]
locale = "en"
name = "English"
default = true

[[project.plugins.i18n.languages]]
locale = "pt"
name = "Português"
site_name = "Documentação"

[project.plugins.i18n.languages.nav_translations]
"Home" = "Início"
"Guide" = "Guia"
"Install" = "Instalação"

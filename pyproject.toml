[build-system]
requires = ["uv_build>=0.11.21,<0.14"]
build-backend = "uv_build"

[project]
name = "zensical-i18n"
version = "0.2.0"
description = "Multi-language sites for Zensical, compatible with mkdocs-static-i18n"
authors = [
    { name = "Humberto Sandmann", email = "hsandmann@ieee.org" }
]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zensical", "mkdocs", "i18n", "l10n", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.1.8",
    "markdown>=3.7",
    # Hooks into Zensical's configuration internals - widen after testing
    "zensical>=0.0.70,<0.1",
]

[project.urls]
Homepage = "https://github.com/hsandmann/zensical-i18n"
Documentation = "https://github.com/hsandmann/zensical-i18n#readme"
Source = "https://github.com/hsandmann/zensical-i18n"
Changelog = "https://github.com/hsandmann/zensical-i18n/releases"
Issues = "https://github.com/hsandmann/zensical-i18n/issues"
"llms.txt" = "https://raw.githubusercontent.com/hsandmann/zensical-i18n/master/llms.txt"

[project.scripts]
zensical-i18n = "zensical_i18n.main:cli"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "pytest>=9.0.3",
    "ruff>=0.12.8",
    "ty>=0.0.32",
]

[tool.uv.build-backend]
module-root = "python"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

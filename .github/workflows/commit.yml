name: Commit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^(feature|fix|performance|refactor|docs|test|chore|build|ci): [^ ].*$'
          STATUS=0
          for id in $(git log "$BASE..$HEAD" --format=%h --no-merges); do
            SUBJECT=$(git log -1 --format=%s "$id")
            if ! echo "$SUBJECT" | grep -Eq "$PATTERN"; then
              echo "::error::Invalid commit message in $id"
              STATUS=1
            fi
          done
          exit $STATUS

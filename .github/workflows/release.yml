name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

# Permissions are granted per job, so each job only gets what it needs
permissions: {}

jobs:
  build:
    name: Build
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  verify:
    name: Verify version
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! [[ "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branch must be named release/v<major>.<minor>.<patch>"
            exit 1
          fi
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          if [ "release/v$VERSION" != "$BRANCH" ]; then
            echo "Version $VERSION in pyproject.toml doesn't match the branch"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Version $VERSION was already released"
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: pypi
      url: https://pypi.org/project/zensical-i18n/
    permissions:
      attestations: write # Required for attestations
      id-token: write     # Required for OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          show-summary: false
          subject-path: dist/*

      - name: Publish to pypi.org
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - verify
      - publish
    permissions:
      contents: write # Required for tags and releases
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Creating the release creates the tag on the merge commit, so the
      # repository doesn't need to be checked out with credentials
      - name: Create release
        run: |
          gh release create "$VERSION" dist/* \
            --target "$TARGET" \
            --title "${VERSION#v}" \
            --generate-notes
